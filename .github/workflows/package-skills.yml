name: Package Skills
on:
  push:
    branches: [master]
    paths: ['skills/**']
  release:
    types: [published]
jobs:
  # On push to master: package every skill so the latest <name>.skill artifacts
  # stay available. Does not touch releases.
  package-all:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package all skills
        run: |
          mkdir -p dist
          # Find every SKILL.md recursively so nested family dirs
          # (skills/mm-wiki/mm-wiki-ingest) are included. Non-skill dirs
          # (skills/mm-wiki — the family home) have no SKILL.md and are skipped.
          while IFS= read -r skill_md; do
            dir="$(dirname "$skill_md")"
            name="$(basename "$dir")"
            parent="$(dirname "$dir")"
            # tar from the skill's parent with the flat basename so the .skill
            # archive has the skill contents at its root (not nested).
            tar -czf "dist/${name}.skill" -C "$parent" "$name"
          done < <(find skills -name SKILL.md | sort)
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: skills
          path: dist/

  # On a published release: the tag is <skill-name>/v<version>. Package and
  # upload ONLY that skill, then promote its [Unreleased] CHANGELOG section.
  release-skill:
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'agents/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - name: Parse skill + version from tag
        id: parse
        run: |
          TAG="${{ github.event.release.tag_name }}"
          case "$TAG" in
            */v*) ;;
            *) echo "::error::Tag '$TAG' must be <skill-name>/v<version>"; exit 1 ;;
          esac
          SKILL_NAME="${TAG%/*}"
          VERSION="${TAG##*/}"; VERSION="${VERSION#v}"
          [ -f "skills/$SKILL_NAME/SKILL.md" ] || { echo "::error::skills/$SKILL_NAME/SKILL.md not found"; exit 1; }
          # Flat artifact name: skills/mm-wiki/mm-wiki-ingest -> mm-wiki-ingest.
          SKILL_ID="$(basename "$SKILL_NAME")"
          echo "skill=$SKILL_NAME" >> "$GITHUB_OUTPUT"
          echo "skill_id=$SKILL_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package the released skill
        run: bash scripts/package-skill.sh "${{ steps.parse.outputs.skill }}" "${{ steps.parse.outputs.version }}"
      - name: Package cane-wiki platform variants
        if: steps.parse.outputs.skill == 'cane-wiki-init'
        run: |
          bash scripts/package-skill-claude-code.sh "${{ steps.parse.outputs.skill }}" "${{ steps.parse.outputs.version }}"
          bash scripts/package-skill-codex.sh "${{ steps.parse.outputs.skill }}" "${{ steps.parse.outputs.version }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.parse.outputs.skill_id }}.skill
            dist/${{ steps.parse.outputs.skill_id }}-${{ steps.parse.outputs.version }}.skill
            dist/${{ steps.parse.outputs.skill_id }}-claude-code-${{ steps.parse.outputs.version }}.zip
            dist/${{ steps.parse.outputs.skill_id }}-codex-${{ steps.parse.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote skill CHANGELOG
        run: |
          SKILL="${{ steps.parse.outputs.skill }}"
          VERSION="${{ steps.parse.outputs.version }}"
          CL="skills/$SKILL/CHANGELOG.md"
          [ -f "$CL" ] || { echo "No $CL; skipping promotion."; exit 0; }
          DATE="$(date -u +%Y-%m-%d)"
          sed -i "s/## \[Unreleased\]/## [${VERSION}] - ${DATE}/" "$CL"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CL"
          git diff --cached --quiet || { git commit -m "chore: promote ${SKILL} CHANGELOG for v${VERSION}" && git push origin master; }

  release-agent:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'agents/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Parse agent and version from tag
        id: parse
        run: |
          TAG="${{ github.event.release.tag_name }}"
          case "$TAG" in
            agents/*/v*) ;;
            *) echo "::error::Tag '$TAG' must be agents/<name>/v<version>"; exit 1 ;;
          esac
          AGENT="${TAG#agents/}"; AGENT="${AGENT%/*}"
          VERSION="${TAG##*/}"; VERSION="${VERSION#v}"
          case "$AGENT" in
            ''|*/*|*[!a-zA-Z0-9_-]*) echo "::error::Invalid agent name"; exit 1 ;;
          esac
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid agent version"; exit 1; }
          [ -f "agents/$AGENT/$AGENT.md" ] || { echo "::error::Agent file missing"; exit 1; }
          [ "$(tr -d '[:space:]' < "agents/$AGENT/VERSION")" = "$VERSION" ] || { echo "::error::Agent version does not match tag"; exit 1; }
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package the released agent
        run: |
          mkdir -p dist
          cp "agents/${{ steps.parse.outputs.agent }}/${{ steps.parse.outputs.agent }}.md" "dist/${{ steps.parse.outputs.agent }}-${{ steps.parse.outputs.version }}.md"
          python3 scripts/build-codex-agent.py --check "${{ steps.parse.outputs.agent }}"
          cp "agents/${{ steps.parse.outputs.agent }}/${{ steps.parse.outputs.agent }}.codex.toml" "dist/${{ steps.parse.outputs.agent }}-${{ steps.parse.outputs.version }}.toml"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.parse.outputs.agent }}-${{ steps.parse.outputs.version }}.md
            dist/${{ steps.parse.outputs.agent }}-${{ steps.parse.outputs.version }}.toml
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
