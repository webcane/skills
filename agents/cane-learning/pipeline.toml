[metadata]
name = "cane-learning"
author = "Cane"
version = "0.1.0"
methodology = "Master Prompt v2.0 — Concept Learning Article Writer"

[run]
max_revisions = 2
timeout_seconds = 300
command = ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "-s", "read-only", "--color", "never"]

[depth]
focused = "Все P0, только необходимые P1. Основной механизм и одна существенная граница. Три упражнения."
standard = "Все P0 и P1, нужные для учебной цели. Покажи практические компромиссы и перенос. Три–четыре упражнения."
deep = "Все P0 и релевантные P1, связанные причинные цепочки и контрпримеры. Включай P2, если они проясняют P0/P1. Четыре–пять упражнений."

[projections]
article = "Учебная статья: определение, назначение, контракт и механизм, несколько применений, границы и 3–5 задач."
summary = "Краткий конспект для повторения: определение, основные принципы, операции, ключевые ограничения и компактные примеры."
concept = "Смысловая модель: определение, центральная идея, контракты, инварианты, условия, причинные связи и границы."
internals = "Внутреннее устройство: как реализация работает, её структура, процессы, стоимость, границы и связь с контрактом. Обозначай реализацию и версию."

[contracts]
analyst = "ConceptModel"
designer = "LearningSpec"
writer = "ArticleDraft"
reviewer = "QualityReport"
