[metadata]
name = "cane-learning"
author = "Cane"
version = "0.6.0"
methodology = "Problem-First Architecture + End-to-End Learning"

[run]
max_revisions = 2
timeout_seconds = 300
command = ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "-s", "read-only", "--color", "never"]

[depth]
focused = "Ядро темы, основной механизм и одна существенная граница. Для overview — только самое необходимое для сценария."
standard = "P0 и нужные P1, практические компромиссы и перенос. Для overview — больше точности, но не больше слоёв."
deep = "Связанные причинные цепочки, контрпримеры и P2, если они проясняют P0/P1. Применяй к deep-dive и линзам, не к overview."

[projections]
overview = "Базовая страница по умолчанию: лёгкое связное объяснение технологии, её проблемы, одного сценария, границ и выбора дальнейшей линзы."
summary = "Краткое повторение уже изученной темы; не заменяет overview."
article = "Явно запрошенный глубокий учебный разбор: объединяет несколько линз, примеры и 3–5 задач."
architecture = "Архитектурная линза: компоненты, поток данных, ключевые решения, свойства и компромиссы."
concept = "Смысловая модель: определение, центральная идея, контракты, инварианты, условия, причинные связи и границы."
contracts = "Контракты: гарантии и семантика, предусловия, инварианты, граничные случаи, негарантированное поведение и ограничения с примерами."
usage = "Практическое применение: несколько различных сценариев, идиомы, работающий код, выбор подхода и типичные ошибки."
internals = "Внутреннее устройство: как реализация работает, её структура, процессы, стоимость, границы и связь с контрактом. Обозначай реализацию и версию."
operations = "Эксплуатационная линза: характерные сбои, сигналы, диагностика, предотвращение и восстановление."
performance = "Производительность: стоимость операций, масштабирование, bottlenecks, настройка и измерение."
alternatives = "Выбор технологии: альтернативы, trade-offs, признаки overengineering и критерии решения."

[contracts]
analyst = "ConceptModel"
designer = "LearningSpec"
writer = "ArticleDraft"
reviewer = "QualityReport"
